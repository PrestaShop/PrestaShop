services:
  _defaults:
    public: true

  PrestaShop\PrestaShop\Adapter\CustomerService\Repository\CustomerThreadRepository:
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  PrestaShop\PrestaShop\Adapter\CustomerService\ForwardedMessageRenderer:
    arguments:
      - '@PrestaShop\PrestaShop\Adapter\CustomerService\Repository\CustomerThreadRepository'
      - '@twig'
      - '@router'

  # Command handlers (ids kept from when the classes lived in Core, so existing references keep working)

  prestashop.core.domain.customer_service.command_handler.delete_customer_thread_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\CommandHandler\DeleteCustomerThreadHandler'
    autoconfigure: true
    arguments:
      - '@PrestaShop\PrestaShop\Adapter\CustomerService\Repository\CustomerThreadRepository'

  prestashop.core.domain.customer_service.command_handler.bulk_delete_customer_thread_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\CommandHandler\BulkDeleteCustomerThreadHandler'
    autoconfigure: true
    arguments:
      - '@PrestaShop\PrestaShop\Adapter\CustomerService\Repository\CustomerThreadRepository'

  prestashop.core.domain.customer_service.command_handler.add_order_customer_message:
    class: PrestaShop\PrestaShop\Adapter\CustomerMessage\CommandHandler\AddOrderCustomerMessageHandler
    autoconfigure: true
    arguments:
      - '@translator'
      - '@validator'
      - '@=service("prestashop.adapter.legacy.context").getContext().shop.id'
      - '@=service("prestashop.adapter.legacy.context").getContext().language.id'
      - '@=service("prestashop.adapter.legacy.context").getContext().employee.id'

  prestashop.core.domain.customer_service.command_handler.forward_customer_thread_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\CommandHandler\ForwardCustomerThreadHandler'
    autoconfigure: true
    arguments:
      - '@=service("prestashop.adapter.legacy.context").getContext()'
      - '@PrestaShop\PrestaShop\Adapter\CustomerService\ForwardedMessageRenderer'

  prestashop.core.domain.customer_service.command_handler.reply_to_customer_thread_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\CommandHandler\ReplyToCustomerThreadHandler'
    autoconfigure: true
    arguments:
      - '@=service("prestashop.adapter.legacy.context").getContext()'

  prestashop.core.domain.customer_service.command_handler.update_customer_thread_status_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\CommandHandler\UpdateCustomerThreadStatusHandler'
    autoconfigure: true
    arguments:
      - '@PrestaShop\PrestaShop\Adapter\CustomerService\Repository\CustomerThreadRepository'

  # Query handlers

  prestashop.core.domain.customer_service.query_handler.get_customer_thread_for_viewing_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\QueryHandler\GetCustomerThreadForViewingHandler'
    autoconfigure: true
    arguments:
      - '@=service("prestashop.adapter.legacy.context").getContext()'
      - '@prestashop.core.localization.locale.context_locale'

  prestashop.core.domain.customer_service.query_handler.get_customer_service_signature_handler:
    class: 'PrestaShop\PrestaShop\Adapter\CustomerService\QueryHandler\GetCustomerServiceSignatureHandler'
    autoconfigure: true
    arguments:
      - '@prestashop.adapter.legacy.configuration'
