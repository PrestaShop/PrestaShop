services:
  _defaults:
    public: true

  # Repository backing the Stats page KPI boxes' refresh values.
  PrestaShop\PrestaShop\Adapter\Stats\Repository\StatsRepository:
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  # KPI refresh providers, each indexed by its 'key' tag attribute for KpiRefreshProviderLocator.
  PrestaShop\PrestaShop\Adapter\Kpi\Refresh\ConversionRateKpiRefreshProvider:
    autowire: true
    arguments:
      $configuration: '@prestashop.adapter.legacy.kpi_configuration'
    tags:
      - { name: 'prestashop.kpi_refresh_provider', key: 'conversion_rate' }

  PrestaShop\PrestaShop\Adapter\Kpi\Refresh\AbandonedCartKpiRefreshProvider:
    autowire: true
