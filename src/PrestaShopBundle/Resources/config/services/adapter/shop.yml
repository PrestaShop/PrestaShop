services:
  _defaults:
    public: true

  prestashop.adapter.shop.command_handler.upload_logos_handler:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\UploadLogosHandler'
    autoconfigure: true
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@prestashop.core.shop.logo_uploader'
      - '@prestashop.core.hook.dispatcher'

  prestashop.adapter.shop.url.base_url_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\BaseUrlProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"

  prestashop.adapter.shop.url.help_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\HelpProvider'
    arguments:
      - '@prestashop.adapter.legacy.context'
      - '@translator'
      - '@router'
      - '@PrestaShop\PrestaShop\Core\Help\Documentation'

  prestashop.adapter.shop.url.category_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\CategoryProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"

  prestashop.adapter.shop.url.cms_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\CmsProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"

  prestashop.adapter.shop.url.product_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\ProductProvider'
    arguments:
      - '@=service("prestashop.adapter.legacy.context").getContext().link'

  prestashop.adapter.shop.url.product_preview_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\ProductPreviewProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"
      - '@=service("prestashop.adapter.legacy.configuration").getBoolean("PS_REWRITING_SETTINGS")'
      - '@=service("prestashop.adapter.legacy.context").getContext().employee.id'

  prestashop.adapter.shop.query_handler.get_logos_paths_handler:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\QueryHandler\GetLogosPathsHandler'
    autoconfigure: true
    arguments:
      - '@=service("prestashop.adapter.legacy.configuration").get("_PS_IMG_")'
      - '@=service("prestashop.adapter.legacy.configuration").get("_PS_IMG_DIR_")'

  prestashop.adapter.shop.query_handler.search_shops_handler:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\QueryHandler\SearchShopsHandler'
    autoconfigure: true
    arguments:
      - '@prestashop.core.admin.shop.repository'
      - '@prestashop.core.admin.shop_group.repository'

  prestashop.adapter.shop.url.product_image_folder_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\ImageFolderProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"
      - 'img/p'

  prestashop.adapter.shop.url.attribute_image_folder_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\ImageFolderProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"
      - 'img/co'

  prestashop.adapter.shop.url.category_image_folder_provider:
    class: 'PrestaShop\PrestaShop\Adapter\Shop\Url\ImageFolderProvider'
    arguments:
      - "@=service('prestashop.adapter.legacy.context').getContext().link"
      - 'img/c'

  PrestaShop\PrestaShop\Adapter\Shop\Repository\ShopGroupRepository:
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  PrestaShop\PrestaShop\Adapter\Shop\Repository\ShopRepository:
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  PrestaShop\PrestaShop\Adapter\Shop\Repository\ShopUrlRepository:
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  PrestaShop\PrestaShop\Adapter\Shop\Validate\ShopGroupValidator:
    public: false
    autowire: true

  PrestaShop\PrestaShop\Adapter\Shop\MultistoreOptionsConfiguration:
    public: false
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@PrestaShop\PrestaShop\Adapter\Shop\Repository\ShopUrlRepository'

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\AddShopGroupHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\DeleteShopGroupHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\EditShopGroupHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\QueryHandler\GetShopGroupForEditingHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\QueryHandler\GetShopTreeHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\Validate\ShopUrlValidator:
    public: false

  PrestaShop\PrestaShop\Adapter\Shop\ShopUrlChangeHandler:
    public: false
    arguments:
      - '@PrestaShop\PrestaShop\Adapter\Tools'
      - '@PrestaShop\PrestaShop\Adapter\File\RobotsTextFileGenerator'
      - '@prestashop.adapter.cache.clearer.smarty_cache_clearer'
      - '@prestashop.adapter.cache.clearer.media_cache_clearer'

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\AddShopUrlHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\DeleteShopUrlHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\EditShopUrlHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\ToggleShopUrlMainHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\CommandHandler\ToggleShopUrlStatusHandler:
    public: false
    autowire: true
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Shop\QueryHandler\GetShopUrlForEditingHandler:
    public: false
    autowire: true
    autoconfigure: true
