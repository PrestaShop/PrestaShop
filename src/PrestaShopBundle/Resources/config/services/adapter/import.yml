services:
  _defaults:
    public: true
    # dependencies are discovered by type; a definition below only spells out what autowiring
    # cannot resolve on its own (scalars, expressions, legacy service ids)
    autowire: true

  prestashop.adapter.import.data_match_saver:
    class: 'PrestaShop\PrestaShop\Adapter\Import\DataMatchSaver'
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  prestashop.adapter.import.entity_deleter:
    class: 'PrestaShop\PrestaShop\Adapter\Import\ImportEntityDeleter'
    arguments:
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'
      - '@prestashop.adapter.legacy.configuration'
      - '@prestashop.core.image.file_deleter'

  prestashop.adapter.import.excel_to_csv_converter:
    class: 'PrestaShop\PrestaShop\Adapter\Converter\ExcelToCsvFileConverter'
    arguments:
      - '@filesystem'
      - '@=service("prestashop.core.import.dir").getDir() ~ "csvfromexcel/"'

  prestashop.adapter.import.file_opener:
    class: 'PrestaShop\PrestaShop\Adapter\Import\CsvFileOpener'
    arguments:
      - '@prestashop.adapter.import.excel_to_csv_converter'

  prestashop.adapter.import.handler.product:
    class: 'PrestaShop\PrestaShop\Adapter\Import\Handler\ProductImportHandler'
    arguments:
      - '@prestashop.adapter.import.data_formatter'
      - '@=service("prestashop.adapter.shop.context").getAllShopIds()'
      - '@=service("prestashop.adapter.shop.context").getContextListShopID()'
      - '@=service("prestashop.adapter.legacy.context").getContext().shop.id'
      - '@=service("prestashop.adapter.feature.multistore").isUsed()'
      - '@=service("prestashop.adapter.legacy.context").getContext().language.id'
      - '@translator'
      - '@prestashop.adapter.legacy.logger'
      - '@=service("prestashop.adapter.data_provider.employee").getId()'
      - '@prestashop.adapter.database'
      - '@prestashop.adapter.cache.clearer.smarty_cache_clearer'
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'
      - '@prestashop.adapter.legacy.configuration'
      - '@=service("prestashop.adapter.legacy.context").getContext().shop.getAddress()'
      - '@prestashop.adapter.validate'
      - '@PrestaShop\PrestaShop\Adapter\Tools'
      - '@prestashop.adapter.import.image_copier'

  prestashop.adapter.import.handler.category:
    class: 'PrestaShop\PrestaShop\Adapter\Import\Handler\CategoryImportHandler'
    arguments:
      - '@prestashop.adapter.import.data_formatter'
      - '@=service("prestashop.adapter.shop.context").getAllShopIds()'
      - '@=service("prestashop.adapter.shop.context").getContextListShopID()'
      - '@=service("prestashop.adapter.legacy.context").getContext().shop.id'
      - '@=service("prestashop.adapter.feature.multistore").isUsed()'
      - '@=service("prestashop.adapter.legacy.context").getContext().language.id'
      - '@translator'
      - '@prestashop.adapter.legacy.logger'
      - '@=service("prestashop.adapter.data_provider.employee").getId()'
      - '@prestashop.adapter.database'
      - '@prestashop.adapter.cache.clearer.smarty_cache_clearer'
      - '@prestashop.adapter.legacy.configuration'
      - '@prestashop.adapter.validate'
      - '@prestashop.adapter.import.image_copier'
      - '@PrestaShop\PrestaShop\Adapter\Tools'
      - '@doctrine.dbal.default_connection'
      - '%database_prefix%'

  prestashop.adapter.import.handler_finder:
    class: 'PrestaShop\PrestaShop\Adapter\Import\Handler\ImportHandlerFinder'
    arguments:
      - '@prestashop.adapter.import.handler.category'
      - '@prestashop.adapter.import.handler.product'

  PrestaShop\PrestaShop\Core\Import\Handler\ImportHandlerFinderInterface: '@prestashop.adapter.import.handler_finder'

  prestashop.adapter.import.data_formatter:
    class: 'PrestaShop\PrestaShop\Adapter\Import\ImportDataFormatter'
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@PrestaShop\PrestaShop\Adapter\Tools'

  prestashop.adapter.import.image_copier:
    class: 'PrestaShop\PrestaShop\Adapter\Import\ImageCopier'
    arguments:
      - '@prestashop.adapter.legacy.configuration'
      - '@PrestaShop\PrestaShop\Adapter\Tools'
      - '@=service("prestashop.adapter.legacy.context").getContext().shop.id'
      - '@prestashop.core.hook.dispatcher'

  # --- ImportJob aggregate (Symfony migration step 2) ---

  # Serializes concurrent batches of the SAME job, and nothing else: cancellation is arbitrated by
  # the repository's status probe. Acquisition is always non-blocking, so PersistingStoreInterface
  # is all the handlers need — a BlockingStoreInterface would only matter if a second batch were
  # meant to queue, and it must fail fast instead.
  #
  # FlockStore is per node. This id is the seam: an integration test may alias it to an
  # InMemoryStore, and a multi-node setup to a DoctrineDbalStore.
  #
  # Not under kernel.cache_dir: cache:clear wipes it, and a second Continue would then flock a
  # fresh inode while the first still holds the old one. The var/cache root is what
  # CacheClearLocker uses too, and neither cache:clear nor the back-office clearer touch it.
  prestashop.adapter.import.job.lock_store:
    class: 'Symfony\Component\Lock\Store\FlockStore'
    arguments:
      - '%kernel.project_dir%/var/cache/locks/import'

  prestashop.adapter.import.job.lock_factory:
    class: 'Symfony\Component\Lock\LockFactory'
    arguments:
      - '@prestashop.adapter.import.job.lock_store'

  PrestaShopBundle\Entity\Repository\ImportJobRepository:
    factory: [ '@doctrine.orm.default_entity_manager', getRepository ]
    arguments:
      - PrestaShopBundle\Entity\ImportJob

  PrestaShop\PrestaShop\Adapter\Import\ImportTruncator:
    arguments:
      - '@prestashop.adapter.import.entity_deleter'

  PrestaShop\PrestaShop\Adapter\Import\Job\ImportJobLock:
    arguments:
      $lockFactory: '@prestashop.adapter.import.job.lock_factory'

  PrestaShop\PrestaShop\Adapter\Import\Job\ImportJobContextFactory: ~
  PrestaShop\PrestaShop\Adapter\Import\Job\ImportJobStateFactory: ~
  PrestaShop\PrestaShop\Adapter\Import\Job\ImportJobPurger: ~
  PrestaShop\PrestaShop\Adapter\Import\Job\ImportJobSequencer: ~

  PrestaShop\PrestaShop\Adapter\Import\CommandHandler\StartImportJobHandler:
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Import\CommandHandler\ContinueImportJobHandler:
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Import\CommandHandler\CancelImportJobHandler:
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Import\CommandHandler\PurgeImportJobsHandler:
    autoconfigure: true

  PrestaShop\PrestaShop\Adapter\Import\QueryHandler\GetImportJobStateHandler:
    autoconfigure: true
