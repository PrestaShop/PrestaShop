services:
  _defaults:
    public: true
    autowire: true
    autoconfigure: true

  # Engine reader: working files are produced by CsvImportFileNormalizer using
  # one canonical CSV dialect, so this reader needs no per-run separator and
  # no session coupling (unlike the legacy prestashop.core.import.csv_file_reader).
  prestashop.core.import.engine.csv_file_reader:
    class: PrestaShop\PrestaShop\Core\Import\File\CsvFileReader
    arguments:
      $fileOpener: '@prestashop.adapter.import.file_opener'

  PrestaShop\PrestaShop\Core\Import\File\ResumableFileReaderInterface:
    alias: prestashop.core.import.engine.csv_file_reader
    public: true

  PrestaShop\PrestaShop\Core\Import\Engine\File\CsvImportFileNormalizer: ~
  PrestaShop\PrestaShop\Core\Import\Engine\ValueParser: ~
  PrestaShop\PrestaShop\Core\Import\Engine\FileDownloader: ~

  # Registry of every tagged importer; the tag is applied automatically to
  # any autoconfigured service implementing EntityImporterInterface
  # (registerForAutoconfiguration in PrestaShopExtension) - including module
  # services, as long as their definitions enable autoconfiguration.
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporterRegistry: ~

  # Shared entity-importer internals
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\RowMapper: ~

  # Product importer and its internals (persistence goes through CQRS
  # commands and the existing Adapter repositories)
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\Product\ProductIdentityResolver: ~
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\Product\ProductRowValidator: ~

  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\Product\ProductAssociationResolver:
    arguments:
      $dataFormatter: '@prestashop.adapter.import.data_formatter'

  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\Product\AccessoriesPrecheck: ~
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\Product\ProductRowImporter: ~
  PrestaShop\PrestaShop\Core\Import\Engine\EntityImporter\ProductImporter: ~
