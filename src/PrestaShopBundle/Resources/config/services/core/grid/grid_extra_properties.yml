services:
  _defaults:
    autowire: true
    public: false

  PrestaShop\PrestaShop\Core\ExtraProperty\Grid\ExtraPropertiesGridDefinitionModifier:
    arguments:
      $repository: '@PrestaShop\PrestaShop\Core\ExtraProperty\Definition\ExtraPropertyDefinitionRepositoryInterface'
      $translator: '@translator'
      $shopContext: '@PrestaShop\PrestaShop\Core\Context\ShopContext'
      $definitionShopFilter: '@PrestaShop\PrestaShop\Core\ExtraProperty\Definition\ExtraPropertyDefinitionShopFilterInterface'

  PrestaShop\PrestaShop\Core\ExtraProperty\Grid\ExtraPropertiesGridQueryBuilderModifier:
    arguments:
      $repository: '@PrestaShop\PrestaShop\Core\ExtraProperty\Definition\ExtraPropertyDefinitionRepositoryInterface'
      $dbPrefix: '%database_prefix%'
      $languageContext: '@PrestaShop\PrestaShop\Core\Context\LanguageContext'
      $shopContext: '@PrestaShop\PrestaShop\Core\Context\ShopContext'
      $definitionShopFilter: '@PrestaShop\PrestaShop\Core\ExtraProperty\Definition\ExtraPropertyDefinitionShopFilterInterface'
      # Diagnoses grids the modifier must skip (derived-table pagination, see issue #42536).
      $logger: '@logger'
