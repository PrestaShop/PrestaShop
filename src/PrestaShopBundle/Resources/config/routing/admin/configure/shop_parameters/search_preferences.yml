admin_search_preferences_index:
  path: /preferences/
  methods: [ GET ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::preferencesIndexAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf
    _legacy_feature_flag: search_page

admin_search_alias_index:
  path: /
  methods: [ GET ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchAliasController::indexAction
    _legacy_controller: AdminAliases
    _legacy_link: AdminAliases

admin_search_alias_search:
  path: /
  methods: [ POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\CommonController::searchGridAction
    gridDefinitionFactoryServiceId: PrestaShop\PrestaShop\Core\Grid\Definition\Factory\AliasGridDefinitionFactory
    redirectRoute: admin_search_alias_index
    _legacy_link: AdminAliases:submitFilteralias
    _legacy_controller: AdminAliases

admin_search_alias_delete:
  path: /{searchTerm}/delete
  methods: [ POST, DELETE ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchAliasController::deleteAction
    _legacy_link: AdminAliases:deletealias
    _legacy_controller: AdminAliases
  requirements:
    searchTerm: "[^\/]+"

admin_search_alias_bulk_delete:
  path: /bulk-delete
  methods: [ POST, DELETE ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchAliasController::bulkDeleteAction
    _legacy_link: AdminAliases:submitBulkdeletealias
    _legacy_controller: AdminAliases

admin_search_alias_create:
  path: /new
  methods: [ GET, POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchAliasController::createAction
    _legacy_link: AdminAliases:addalias
    _legacy_controller: AdminAliases

admin_search_alias_edit:
  path: /{searchTerm}/edit
  methods: [ GET, POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchAliasController::editAction
    _legacy_link: AdminAliases:updatealias
    _legacy_parameters:
      searchTerm: searchTerm
    _legacy_controller: AdminAliases
  requirements:
    searchTerm: "[^\/]+"

admin_search_indexation_save:
  path: /indexation/save
  methods: [ PATCH, POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::processIndexationFormAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf:update
    _legacy_feature_flag: search_page

admin_search_indexation_add_missing:
  path: /indexation/add-missing
  methods: [ POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::addMissingToIndexAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf:addMissingToIndex
    _legacy_feature_flag: search_page

admin_search_indexation_rebuild:
  path: /indexation/rebuild
  methods: [ POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::rebuildIndexAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf:rebuildIndex
    _legacy_feature_flag: search_page

admin_search_indexation_cron:
  path: /indexation/cron
  methods: [ GET, POST ] # GET because cron jobs usually call the URL with a plain GET
  defaults:
    # No _legacy_link on purpose: cron jobs already configured with the legacy AdminSearch URL keep being served by the
    # legacy controller directly, a redirection would silently break crontabs whose HTTP client does not follow it.
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::cronIndexationAction
    _anonymous_controller: true

admin_search_options_save:
  path: /options/save
  methods: [ PATCH, POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::processSearchOptionsFormAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf:update
    _legacy_feature_flag: search_page

admin_search_weight_save:
  path: /weight/save
  methods: [ PATCH, POST ]
  defaults:
    _controller: PrestaShopBundle\Controller\Admin\Configure\ShopParameters\SearchConfigurationController::processWeightFormAction
    _legacy_controller: AdminSearchConf
    _legacy_link: AdminSearchConf:update
    _legacy_feature_flag: search_page
