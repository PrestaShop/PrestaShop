admin_security_headers_index:
  path: /
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::indexAction'

admin_security_headers_search:
  path: /
  methods: [ POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\CommonController::searchGridAction'
    gridDefinitionFactoryServiceId: prestashop.core.grid.definition.factory.csp_log
    redirectRoute: admin_security_headers_index
    # Keep the current surface (?context=admin) when the grid filter redirects back to the page.
    redirectQueryParamsToKeep:
      - 'context'
    _parent: admin_security_headers_index

admin_security_headers_csp_save:
  path: /settings
  methods: [ POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::saveAction'
    _parent: admin_security_headers_index

admin_security_headers_save:
  path: /headers
  methods: [ POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::saveSecurityHeadersAction'
    _parent: admin_security_headers_index

admin_security_headers_add:
  path: /allow-list/add
  methods: [ GET, POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::addAction'
    _parent: admin_security_headers_index

admin_security_headers_clear_log:
  path: /clear-log
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::clearLogAction'
    _parent: admin_security_headers_index

admin_security_headers_allow:
  path: /allow/{cspLogId}
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::allowAction'
    _parent: admin_security_headers_index
  requirements:
    cspLogId: \d+

admin_security_headers_revoke:
  path: /revoke/{cspRuleId}
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::revokeAction'
    _parent: admin_security_headers_index
  requirements:
    cspRuleId: \d+

admin_security_headers_bulk_revoke:
  path: /bulk-revoke
  methods: [ POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::bulkRevokeAction'
    _parent: admin_security_headers_index

# The bulk-action modal posts to a bare route (the shared bulk template drops route params),
# so the back-office surface gets its own route that carries the context as a route default.
admin_security_headers_bulk_revoke_admin:
  path: /bulk-revoke/admin
  methods: [ POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\SecurityHeadersController::bulkRevokeAction'
    _parent: admin_security_headers_index
    context: admin
