admin_shops_search:
  path: /search/{searchTerm}
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\ShopController::searchAction'
  options:
    expose: true

admin_shops_search_by_query:
  path: /search
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\Configure\AdvancedParameters\ShopController::searchByQueryAction'
  options:
    expose: true
