admin_dashboard_index:
  path: /
  methods: [ GET, POST ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\DashboardController::indexAction'
    _legacy_controller: AdminDashboard
    _legacy_link: AdminDashboard
    _legacy_feature_flag: dashboard
  options:
    expose: true

admin_dashboard_toggle_simulation:
  path: /toggle-simulation
  methods: [ GET ]
  defaults:
    _controller: 'PrestaShopBundle\Controller\Admin\DashboardController::toggleSimulationAction'
    _legacy_controller: AdminDashboard
    _legacy_feature_flag: dashboard
  options:
    expose: true
