version: 2
updates:
  - package-ecosystem: npm
    directory: "/tests/UI"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 10
    target-branch: develop
    groups:
      ui-tests-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    reviewers:
      - "PrestaShop/qa-automation"
    labels:
      - "dependencies"
      - "develop"
      - "E2E Tests"
      - "TE"
