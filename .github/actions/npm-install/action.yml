name: Install npm dependencies
description: Restores the node_modules folder of a package, or installs it with npm ci and saves it at the end of the job

inputs:
  DIRECTORY:
    description: Folder of the package.json
    required: true

runs:
  using: 'composite'
  steps:
    # npm ci also checks that package.json and package-lock.json match, so both are part of the key.
    # The cache version depends on the path spelling too ("./tests/UI/" or "tests/UI"), so it is normalized.
    - name: Compute node_modules cache key
      if: github.repository == 'PrestaShop/PrestaShop'
      id: key
      shell: bash
      working-directory: ${{ inputs.DIRECTORY }}
      run: |
        echo "key=${{ runner.os }}-node_modules-$(node -v)-$(cat package.json package-lock.json | sha256sum | cut -c1-40)" >> $GITHUB_OUTPUT
        echo "path=$(realpath -m --relative-to="$GITHUB_WORKSPACE" node_modules)" >> $GITHUB_OUTPUT

    - name: Cache node_modules
      if: github.repository == 'PrestaShop/PrestaShop'
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}

    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.DIRECTORY }}
      run: npm ci
