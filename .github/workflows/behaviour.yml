name: Behaviour tests
on:
  push:
  pull_request:

permissions:
  contents: read   #   to clone the repos and get release assets (shivammathur/setup-php)
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# Pull-requests on a private repository are not coming from a fork, so avoid running the same job twice with push and pull_request events.
jobs:
  # Define which PHP versions need to be used
  workflow_matrix_generator:
    if: github.event_name != 'push' || !github.event.repository.private
    name: PHP matrix
    uses: ./.github/workflows/workflow-matrix-generator.yml
    with:
      matrix_type: PHP
  behaviour:
    permissions:
      contents: read   #   to clone the repos and get release assets (shivammathur/setup-php)
    name: Behaviour tests
    runs-on: ubuntu-latest
    needs: workflow_matrix_generator
    strategy:
      matrix:
        php: ${{ fromJSON(needs.workflow_matrix_generator.outputs.dynamic_matrix) }}
      fail-fast: false
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv, opcache
          coverage: none
          # Each Behat suite runs in a new PHP process: the file cache shares the compiled scripts between them.
          # The optimizer of PHP 8.1 runs the finally block of a try block that was never entered, it stays off there.
          ini-values: opcache.enable_cli=1, opcache.file_cache=/tmp/php-opcache, opcache.memory_consumption=256${{ matrix.php == '8.1' && ', opcache.optimization_level=0' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the OPcache file cache folder
        run: mkdir -p /tmp/php-opcache
      - name: Setup MySQL
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.0"
          root-password: 'password'
          # The test databases are throwaway: no durability, no binary log, more memory for the concurrent lanes
          my-cnf: |
            innodb_flush_log_at_trx_commit=2
            innodb_doublewrite=OFF
            skip-log-bin
            innodb_buffer_pool_size=1G
            performance_schema=OFF
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - uses: actions/checkout@v5

      - name: PrestaShop Configuration
        run: |
          cp .github/workflows/phpunit/parameters.yml app/config/parameters.yml
          cp .github/workflows/phpunit/parameters.php app/config/parameters.php

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Node Directory
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache Composer Directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Build theme assets
        run: make front-classic

      - name: Install maildev
        run: |
          docker run -d -p 1080:1080 -p 1025:1025 maildev/maildev:2.2.1
          bash -c 'while [[ "$(curl -L -s -o /dev/null -w %{http_code} http://localhost:1080)" != "200" ]]; do echo "Wait for maildev"; sleep 5; done'

      - name: Run integration-behaviour-tests
        run: composer run-script integration-behaviour-tests-parallel --timeout=0
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled

      - name: Upload logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: behaviour-${{ matrix.php }}
          path: |
            ./var/logs

      - name: Test git versionned files unchanged
        run: git diff --exit-code
