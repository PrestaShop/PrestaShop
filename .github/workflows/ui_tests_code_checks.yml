name: UI tests code checks

on:
  push:
    paths:
      - 'tests/UI/**'
      - '.github/workflows/ui_tests_code_checks.yml'
      - '.github/actions/npm-install/**'
      - '.github/actions/playwright-browsers/**'
  pull_request:
    paths:
      - 'tests/UI/**'
      - '.github/workflows/ui_tests_code_checks.yml'
      - '.github/actions/npm-install/**'
      - '.github/actions/playwright-browsers/**'

defaults:
  run:
    working-directory: ./tests/UI/

env:
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Pull-requests on a private repository are not coming from a fork, so avoid running the same job twice with push and pull_request events.
jobs:

  ESLint:
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    name: ESLint

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies in UI tests directory
        uses: ./.github/actions/npm-install
        with:
          DIRECTORY: ./tests/UI

      - name: Check eslint errors
        run: npm run lint

  tscheck:
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    name: TypeScript Check

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies in UI tests directory
        uses: ./.github/actions/npm-install
        with:
          DIRECTORY: ./tests/UI

      - name: Check TypeScript errors
        run: npm run check:typescript

  Steps-identifiers:
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    name: Checking Steps identifiers

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies in UI tests directory
        uses: ./.github/actions/npm-install
        with:
          DIRECTORY: ./tests/UI

      # The default browser of the tests, which launch it even to only list their steps
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
        with:
          DIRECTORY: ./tests/UI

      - name: Generate mocha reports with failed steps
        run: GENERATE_FAILED_STEPS=true npm run test:all
        continue-on-error: true

      - name: Checking doubles in steps identifiers
        run: npm run check:step-identifiers

  suites:
    if: github.event_name != 'push' || !github.event.repository.private
    runs-on: ubuntu-latest
    name: Checking Suites Count

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies in UI tests directory
        uses: ./.github/actions/npm-install
        with:
          DIRECTORY: ./tests/UI

      # The default browser of the tests, which launch it even to only list their steps
      - name: Install browsers
        uses: ./.github/actions/playwright-browsers
        with:
          DIRECTORY: ./tests/UI

      - name: Checking that all suites are executed
        run: npm run check:suites
