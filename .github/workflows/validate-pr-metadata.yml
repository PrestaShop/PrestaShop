name: Validate PR metadata
on:
  pull_request_target:
    types: [ opened, edited, reopened, milestoned, demilestoned ]

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  set-milestone:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Set milestone based on target branch
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const baseBranch = pr.base.ref;
            const action = context.payload.action;

            // Decide from the pull request state rather than from the activity type.
            // Keying on 'opened' alone loses the milestone for good whenever that run
            // does not survive: the concurrency group is shared by every
            // pull_request_target activity, so an edit arriving while the opened run
            // is still going cancels it, and every later event took the skip branch.
            const changes = context.payload.changes;
            const baseChanged = action === 'edited' && !!(changes && changes.base);

            // A removal is deliberate, so it is never undone.
            if (action === 'demilestoned') {
              console.log('Milestone was removed deliberately, not restoring it.');
              return;
            }
            // A milestone already chosen at triage is never overwritten. Re-selecting
            // it when the base branch changes stays the one exception, and this also
            // stops the write below from looping through its own milestoned event.
            if (pr.milestone && !baseChanged) {
              console.log(`Pull request already carries milestone "${pr.milestone.title}", nothing to do.`);
              return;
            }

            // Fetch all open milestones
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            console.log(`Found ${milestones.length} open milestones: ${milestones.map(m => m.title).join(', ')}`);
            console.log(`Target branch: ${baseBranch}`);

            // Parse semver from milestone title (e.g. "9.2.0" or "9.1.1")
            const semverRegex = /^(\d+)\.(\d+)\.(\d+)$/;

            function parseMilestone(title) {
              const match = title.match(semverRegex);
              if (!match) return null;
              return { major: parseInt(match[1]), minor: parseInt(match[2]), patch: parseInt(match[3]) };
            }

            let selectedMilestone = null;

            if (baseBranch === 'develop') {
              // Find the highest major.minor milestone (highest major, then highest minor)
              let best = null;
              for (const ms of milestones) {
                const v = parseMilestone(ms.title);
                if (!v) continue;
                if (!best
                  || v.major > best.version.major
                  || (v.major === best.version.major && v.minor > best.version.minor)
                  || (v.major === best.version.major && v.minor === best.version.minor && v.patch > best.version.patch)
                ) {
                  best = { milestone: ms, version: v };
                }
              }
              selectedMilestone = best?.milestone || null;
            } else {
              // Match branches like "9.1.x" or "9.0.x"
              const branchMatch = baseBranch.match(/^(\d+)\.(\d+)\.x$/);
              if (branchMatch) {
                const branchMajor = parseInt(branchMatch[1]);
                const branchMinor = parseInt(branchMatch[2]);

                // Find the highest patch version for this major.minor
                let best = null;
                for (const ms of milestones) {
                  const v = parseMilestone(ms.title);
                  if (!v) continue;
                  if (v.major === branchMajor && v.minor === branchMinor) {
                    if (!best || v.patch > best.version.patch) {
                      best = { milestone: ms, version: v };
                    }
                  }
                }
                selectedMilestone = best?.milestone || null;
              }
            }

            if (!selectedMilestone) {
              console.log('No matching milestone found, leaving empty.');
              return;
            }

            console.log(`Setting milestone to: ${selectedMilestone.title}`);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              milestone: selectedMilestone.number,
            });

  convention-check:
    needs: set-milestone
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Metadata
        uses: PrestaShop/.github/.github/actions/validate-pr-metadata@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
