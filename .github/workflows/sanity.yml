name: UI tests

on:
  push:
    branches-ignore:
      - 'chore/**'
      - 'dependabot/**'
      - 'merge-*'
    tags:
      - '**'
  pull_request:

permissions:
  contents: read   #   to fetch code (actions/checkout)

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TEST_CAMPAIGN: 'sanity:fast-fail'

# Pull-requests on a private repository are not coming from a fork, so avoid running the same job twice with push and pull_request events.
jobs:
  sanity:
    permissions:
      contents: read   #   to fetch code (actions/checkout)
    runs-on: ubuntu-latest
    name: Sanity
    if: github.event_name != 'push' || !github.event.repository.private
    strategy:
      matrix:
        php: ${{ fromJSON((contains(github.event.pull_request.labels.*.name, 'Run all versions') || startsWith(github.head_ref, 'merge-') || contains(github.event.pull_request.body, '| Category?         | ME')) && '["8.1", "8.2", "8.3", "8.4", "8.5"]' || '["8.1", "8.5"]') }}
        browser: [ chromium ]
        db: [ mysql ]
        include:
          - php: '8.5'
            browser: firefox
            db: mysql
          - php: '8.5'
            browser: chromium
            db: mariadb
      fail-fast: false
    steps:
      - name: Prepare docker prefix with repository name lower cased
        run: |
          REPOSITORY_NAME=${{ github.event.repository.name }}
          echo "DOCKER_PREFIX=${REPOSITORY_NAME@L}" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Setup Environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-env
        with:
          PHP_VERSION: ${{ matrix.php }}
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'false'
          DB_SERVER: ${{ matrix.db }}

      - name: Setup Environment failure
        uses: ./.github/actions/setup-env-export-logs
        with:
          DOCKER_PREFIX: ${{ env.DOCKER_PREFIX }}
          ARTIFACT_NAME: setup-sanity-${{ matrix.php }}-${{ matrix.browser }}-${{ matrix.db }}
          DB_SERVER: ${{ matrix.db }}
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'false'
        if: failure()

      - name: Run Tests
        uses: ./.github/actions/ui-test
        with:
          TEST_CAMPAIGN: ${{ env.TEST_CAMPAIGN }}
          BROWSER: ${{ matrix.browser }}
          DB_SERVER: ${{ matrix.db }}

      - name: Export docker logs
        if: failure()
        run: |
          mkdir -p ./var/docker-logs
          docker logs prestashop-${{ matrix.db }}-1 > ./var/docker-logs/${{ matrix.db }}.log
          docker logs ${{ inputs.DOCKER_PREFIX }}-prestashop-git-1 > ./var/docker-logs/prestashop.log

      - name: Upload Screenshots and logs
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: sanity-${{ matrix.php }}-${{ matrix.browser }}-${{ matrix.db }}
          path: |
            ./tests/UI/screenshots/
            ./var/logs
            ./var/docker-logs
