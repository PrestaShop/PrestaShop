name: AI context
on:
  pull_request:
    paths:
      - '.ai/**'
      - '.claude/**'
      - '.cursor/**'
      - '.github/instructions/**'
      - '.github/workflows/ai-context.yml'
      - '.windsurf/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context-rules:
    name: Context rules up to date
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the rules generated in .claude/rules/
        run: |
          php .ai/bin/generate-context-rules.php --dry-run || {
            echo "::error::The rules of .claude/rules/domain/ and .claude/rules/component/ do not match the .ai/ contexts. Run 'bash .ai/bin/generate-ai-index.sh' and commit the result.";
            exit 1;
          }

      - name: Check the copies of the hand-written rules of .ai/rules/
        run: |
          bash .ai/bin/generate-ai-index.sh > /dev/null
          stale=$(git status --porcelain -- .claude/rules .cursor/rules .windsurf/rules .github/instructions)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::The copies of the .ai/rules/ rules are out of date. Run 'bash .ai/bin/generate-ai-index.sh' and commit the result.";
            exit 1;
          fi
