  learnings:
    scope: auto
    # A learning drawn from a chat waits for an admin approval (Learnings dashboard → Pending approvals) and
    # applies by itself after this many days, 30 at most
    approval_delay: 30
  pull_requests:
    scope: auto
  issues:
    scope: auto
  linked_repositories:
    - repository: "PrestaShop/ADR"
      instructions: >-
        Architecture decisions of the core: the backward compatibility promise (0017) decides what a bug fix
        on a maintenance branch may change, the CQRS ADRs how commands, queries and handlers are split.
    - repository: "PrestaShop/ps_apiresources"
      instructions: >-
        The Admin API endpoints, built on the core CQRS classes: a core change to a command, a query or their
        value objects may break a resource of this module.
