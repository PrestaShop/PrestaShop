# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration of the core.
# The rules live in .ai/ (root CONTEXT.md, then the Domain and Component contexts); this file sets how
# CodeRabbit runs and which context applies to which files: it changes when a context is added or its Layers
# table moves, never when a rule does.
# Reference: https://docs.coderabbit.ai/reference/configuration

language: en-US
tone_instructions: >-
  Direct, no praise. One finding per comment, naming the .ai/ rule it breaks.

reviews:
  profile: chill
  # Never blocks the merge: no "Request changes", no pre-merge check
  request_changes_workflow: false
  # The findings go inline; the walkthrough comment stays as short as possible
  high_level_summary: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  review_status: false
  review_info: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!vendor/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!.ai/generated/**"
    # Built or vendored assets
    - "!admin-dev/themes/*/public/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!js/jquery/**"
    - "!js/tiny_mce/**"
    - "!js/vendor/**"
    - "!themes/_libraries/**"
    # Translation catalogs, extracted from the code
    - "!translations/**"
  auto_review:
    enabled: false
    auto_incremental_review: true
    # PRs also target the maintenance branches (9.2.x, 8.2.x…)
    base_branches:
      - "^\\d+\\.\\d+\\.x$"
  finishing_touches:
    # The root CONTEXT.md asks for minimal comments
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: true
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
  tools:
    # Reads the CI results instead of repeating PHPStan, php-cs-fixer, ESLint and the tests
    github-checks:
      enabled: true
    phpstan:
      enabled: false
    phpcs:
      enabled: false
    phpmd:
      enabled: false
    eslint:
      enabled: false

chat:
  art: false
  # Answers a reply to its own comments without a mention; no setting limits it to those threads, so it may
  # also answer another comment it considers addressed to it
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      # A string entry only applies to the folder of its file (.ai/Component/Grid/ for the Grid context), and the
      # references of CLAUDE.md or of a context are not followed: each context is mapped to the code it covers,
      # with the globs of its Claude rule (.claude/rules/domain|component/), the files check-conventions.php
      # maps to it too.
      - files: ".ai/CONTEXT.md, .ai/CONTAINERS.md, .ai/GOTCHAS.md, .ai/MULTISTORE.md"
        applyTo: "**"
      - files: ".ai/STRUCTURE.md"
        applyTo: ".ai/**"
      # BEGIN generated by .ai/bin/generate-ai-index.sh from .ai/bin/context-index.php: edit the Layers table of a context, not these lines
