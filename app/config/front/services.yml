# Dedicated services for Front app
services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  # Sends the storefront CSP headers on FrontKernel (PS_FF_FRONT_CONTAINER_V2) responses; the default
  # legacy dispatch is covered by a delegate in FrontController. autoconfigure tags it as an event
  # subscriber. The same class serves the back office, registered with CspContext::ADMIN in app/config/admin.
  PrestaShop\PrestaShop\Adapter\Csp\CspHeaderSubscriber:
    arguments:
      $cspContext: !php/enum PrestaShop\PrestaShop\Core\Domain\Csp\ValueObject\CspContext::FRONT
