# Dedicated services for Admin app
services:
  _defaults:
    public: false
    autowire: true
    autoconfigure: true

  # ROUTING
  # The tokenized router only makes sense for the back office, where the CSRF token in the URL is
  # part of the admin security model. Defining it here rather than in the bundle keeps it out of the
  # front office and the Admin API containers, whose generated URLs (an API Location header, for
  # instance) have no use for an admin token. See RouterPass, which only aliases when it is defined.
  prestashop.router:
    class: PrestaShopBundle\Service\Routing\Router
    parent: 'router.default'
    public: true
    # This file's _defaults autowire, which would try to resolve the parent router's own constructor
    # (LoaderInterface and friends) and fail on an abstract definition. The parent supplies them.
    autowire: false
    autoconfigure: false
    arguments:
      $container: '@service_container'
    calls:
      - [ 'setUserTokenManager', [ '@PrestaShopBundle\Security\Admin\UserTokenManager' ] ]
      - [ 'setAnonymousRouteProvider', [ '@PrestaShopBundle\Routing\AnonymousRouteProvider' ] ]

  # SECURITY
  PrestaShopBundle\EventListener\Admin\TokenizedUrlsListener:
    autowire: true
    arguments:
      $map: '@security.access_map'
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

  PrestaShopBundle\EventListener\Admin\EmployeeSessionSubscriber:
    autowire: true
    autoconfigure: true
    arguments:
      $entityManager: '@doctrine.orm.default_entity_manager'

  # Priority 40 to be called before the RouterListener (which has priority 32)
  PrestaShopBundle\EventListener\Admin\LegacyUrlListener:
    arguments:
      - "@prestashop.bundle.routing.converter.legacy_url_converter"
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 40 }

  # Priority 30 to be called after the RouterListener
  PrestaShopBundle\EventListener\Admin\LegacyParametersListener:
    arguments:
      - "@prestashop.bundle.routing.converter.legacy_parameters_converter"
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 30 }

  PrestaShopBundle\EventListener\Admin\AccessDeniedListener:
    autowire: true
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

  PrestaShopBundle\EventListener\Admin\AdminSecurityListener:
    autowire: true
    tags:
      - { name: kernel.event_listener, event: kernel.controller, method: onKernelController }

  PrestaShopBundle\EventListener\Admin\BackUrlRedirectResponseListener:
    arguments:
      - '@PrestaShop\PrestaShop\Core\Util\Url\BackUrlProvider'
      - "@prestashop.adapter.legacy.context"
    tags:
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse }

  # Locale listener to define translator locale correctly
  PrestaShopBundle\EventListener\Admin\UserLocaleSubscriber: ~

  PrestaShopBundle\EventListener\Admin\DemoModeEnabledListener: ~

  # Context listeners, these are event subscribers, so they define their priority themselves
  PrestaShopBundle\EventListener\Admin\Context\EmployeeContextSubscriber: ~
  PrestaShopBundle\EventListener\Admin\Context\LanguageContextSubscriber: ~

  PrestaShopBundle\EventListener\Admin\Context\ShopContextSubscriber:
    autowire: true
    autoconfigure: true
    arguments:
      $router: '@router'

  PrestaShopBundle\EventListener\Admin\Context\CurrencyContextSubscriber: ~
  PrestaShopBundle\EventListener\Admin\Context\CountryContextSubscriber: ~
  PrestaShopBundle\EventListener\Admin\Context\LegacyControllerContextSubscriber: ~

  PrestaShopBundle\EventListener\Admin\Context\LegacyContextSubscriber:
    autowire: true
    autoconfigure: true
    arguments:
      $legacyBuilders: !tagged_iterator core.legacy_context_builder

  # SSL middleware
  PrestaShopBundle\EventListener\Admin\SSLMiddlewareListener:
    autowire: true
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest }

  # ─── Extra property definition form (Admin API endpoint catalog consumers) ────
  # The endpoint catalog reads the OpenApi document, and API Platform only registers its OpenApi
  # services where enable_swagger is on — this kernel. Defining the catalog and its consumers here
  # (instead of the shared services/extra_property/catalog.yml) keeps the other kernels compiling;
  # using them elsewhere will fail loudly, hinting that swagger must be enabled there first.

  PrestaShop\PrestaShop\Core\ExtraProperty\Catalog\ApiEndpointCatalog:
    arguments:
      $openApiFactory: '@api_platform.openapi.factory'
      $logger: '@logger'
      $cache: '@prestashop.extra_property.catalog.filesystem_cache'

  PrestaShop\PrestaShop\Core\ExtraProperty\Catalog\AssociationExistenceChecker:
    arguments:
      $translator: '@translator'

  PrestaShopBundle\Form\Admin\Configure\AdvancedParameters\ExtraPropertyDefinition\ExtraPropertyDefinitionAdvancedType:
    arguments:
      # Same $locales expression as the form types bind in services/bundle/form/form_type.yml.
      $locales: "@=service('prestashop.adapter.legacy.context').getLanguages(false)"
