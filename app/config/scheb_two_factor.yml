scheb_two_factor:
  two_factor_token_factory: 'PrestaShopBundle\SchebTwoFactor\TrustedDeviceTokenFactory'
  security_tokens:
    - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken

  totp:
    enabled: true
    issuer: 'PrestaShop'
    template: '@PrestaShop/Admin/TwoFactorAuthentication/2fa_form.html.twig'

  email:
    enabled: true
    digits: 6
    code_generator: 'PrestaShopBundle\SchebTwoFactor\EmployeeEmailCodeGenerator'
    mailer: 'PrestaShop\PrestaShop\Adapter\TotMailer\TwoFactorAuthCodePrestashopMailer'
    template: '@PrestaShop/Admin/TwoFactorAuthentication/2fa_form.html.twig'

  backup_codes:
    enabled: true
    manager: 'PrestaShopBundle\SchebTwoFactor\EmployeeBackupCodeManager'

  trusted_device:
    enabled: true
    manager: 'PrestaShopBundle\SchebTwoFactor\EmployeeTrustedDeviceManager'
    cookie_name: trusted_device

services:
  PrestaShopBundle\SchebTwoFactor\DynamicIssuerTotpAuthenticator:
    decorates: 'scheb_two_factor.security.totp_authenticator'
    decoration_on_invalid: ignore
    arguments:
      $inner: '@.inner'
      $configuration: '@PrestaShop\PrestaShop\Adapter\Configuration'
